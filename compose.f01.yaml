name: g2-despacho-f01

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: '1400'

# Entorno F-01 con persistencia real. Reutiliza las credenciales locales de Gestión.
# Ejecutar: docker compose -f compose.f01.yaml up --build -d
services:
  seguridad-local:
    build: ./herramientas/seguridad-local
    environment:
      HABILITAR_SEGURIDAD_LOCAL: 'true'
      DIRECCION_ESCUCHA: 0.0.0.0
      PORT: '8090'
    ports:
      - '127.0.0.1:8090:8090'

  servicio-gestion-despachos:
    build: ./servicio-gestion-despachos
    env_file: ./servicio-gestion-despachos/.env
    entrypoint: [/bin/sh, -c]
    command:
      - |
        case "$$SPRING_DATASOURCE_URL" in
          *\?*) separador='&' ;;
          *) separador='?' ;;
        esac
        export SPRING_DATASOURCE_URL="$${SPRING_DATASOURCE_URL}$${separador}connectTimeout=5&socketTimeout=10&tcpKeepAlive=true"
        exec java -jar /app/aplicacion.jar
    environment:
      PORT: '8081'
      SPRING_PROFILES_ACTIVE: default
      SEGURIDAD_URL: http://seguridad-local:8090
      SEGURIDAD_AUDIENCIA: api-despacho
      SEGURIDAD_ALGORITMO: RS256
      SPRING_FLYWAY_ENABLED: 'false'
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      # Pool pequeño y validación acotada para conexiones remotas al pooler de Supabase.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '6'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '2'
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: '120000'
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: '30000'
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: '2000'
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: '8000'
      DOCUMENTACION_HABILITADA: 'true'
      GATEWAY_PUBLIC_URL: http://localhost:8080
      JAVA_TOOL_OPTIONS: '-Xms64m -Xmx384m'
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      seguridad-local:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    environment:
      PORT: '8080'
      SEGURIDAD_URL: http://seguridad-local:8090
      SEGURIDAD_AUDIENCIA: api-despacho
      SEGURIDAD_ALGORITMO: RS256
      GESTION_DESPACHOS_URL: http://servicio-gestion-despachos:8081
      CORS_ORIGENES: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081
      JAVA_TOOL_OPTIONS: '-Xms64m -Xmx256m'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      seguridad-local:
        condition: service_healthy
      servicio-gestion-despachos:
        condition: service_healthy
