spring:
  application:
    name: servicio-operacion-reparto
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMO:2}
      minimum-idle: ${DB_POOL_MINIMO:0}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false

server:
  port: ${PORT:8082}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${DOCUMENTACION_HABILITADA:false}
  swagger-ui:
    enabled: ${DOCUMENTACION_HABILITADA:false}
    persist-authorization: false

despacho:
  gestion:
    url: ${GESTION_DESPACHOS_URL:http://localhost:8081}
    token-servicio: ${GESTION_TOKEN_SERVICIO:}
    cliente-id: ${GESTION_CLIENT_ID:modulo-despacho}
    cliente-secreto: ${GESTION_CLIENT_SECRET:}
    scopes: ${GESTION_SCOPES:gestion:despachos:transicionar gestion:catalogos:leer}
  demo:
    sin-autenticacion: ${DEMO_SIN_AUTENTICACION:false}
    usuario-id: ${DEMO_USUARIO_ID:00000000-0000-4000-8000-000000000001}
  evidencias:
    supabase-url: ${EVIDENCIAS_STORAGE_URL:}
    supabase-service-key: ${EVIDENCIAS_CLAVE_SERVICIO:}
    tipos-permitidos: ${EVIDENCIAS_TIPOS_PERMITIDOS:image/jpeg,image/png,image/webp}
    maximo-bytes: ${EVIDENCIAS_MAXIMO_BYTES:2097152}
    storage-url: ${EVIDENCIAS_STORAGE_URL:}
    bucket: ${EVIDENCIAS_BUCKET:}
    clave-servicio: ${EVIDENCIAS_CLAVE_SERVICIO:}
  seguridad:
    url: ${SEGURIDAD_URL:}
    audiencia: ${SEGURIDAD_AUDIENCIA:api-despacho}
    algoritmo: ${SEGURIDAD_ALGORITMO:RS256}
  gateway:
    url-publica: ${GATEWAY_PUBLIC_URL:http://localhost:8080}
