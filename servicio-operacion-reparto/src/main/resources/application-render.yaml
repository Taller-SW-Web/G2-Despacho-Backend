# Perfil explícito para Render y Supabase; no activa creación automática de esquema.
spring:
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMO:2}
      minimum-idle: ${DB_POOL_MINIMO:0}
      connection-timeout: 10000
      validation-timeout: 5000
      connection-init-sql: SET statement_timeout = '15s'
despacho:
  gestion:
    url: ${GESTION_DESPACHOS_URL:https://taller-servicio-gestion-despachos.onrender.com}
  gateway:
    url-publica: ${GATEWAY_PUBLIC_URL:https://taller-api-gateway.onrender.com}
