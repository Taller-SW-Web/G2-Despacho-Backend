# Perfil explícito para Render y Supabase; no activa creación automática de esquema.
spring:
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMO:5}
      minimum-idle: ${DB_POOL_MINIMO:1}
      connection-timeout: 10000
      validation-timeout: 5000
      connection-init-sql: SET statement_timeout = '15s'
despacho:
  gateway:
    url-publica: ${GATEWAY_PUBLIC_URL:https://g2-despacho-backend.onrender.com}
