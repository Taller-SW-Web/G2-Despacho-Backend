spring:
  application:
    name: servicio-gestion-despachos
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
  jpa:
    open-in-view: false

server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    rabbit:
      enabled: ${RABBITMQ_SALUD_HABILITADA:false}
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${DOCUMENTACION_HABILITADA:false}
  swagger-ui:
    enabled: ${DOCUMENTACION_HABILITADA:false}
    persist-authorization: false

despacho:
  rabbitmq:
    habilitado: ${RABBITMQ_HABILITADO:false}
  geometrias:
    maximo-bytes: ${GEOMETRIAS_MAXIMO_BYTES:5242880}
  demo:
    sin-autenticacion: ${DEMO_SIN_AUTENTICACION:false}
    usuario-id: ${DEMO_USUARIO_ID:00000000-0000-4000-8000-000000000001}
  seguridad:
    url: ${SEGURIDAD_URL:}
    audiencia: ${SEGURIDAD_AUDIENCIA:api-despacho}
    algoritmo: ${SEGURIDAD_ALGORITMO:RS256}
  gateway:
    url-publica: ${GATEWAY_PUBLIC_URL:http://localhost:8080}
  interno:
    # Secreto que el Gateway envía en X-Despacho-Interno. Con requerido=true, /api/v1/** sin él da 404.
    secreto: ${INTERNO_SECRETO:}
    requerido: ${INTERNO_REQUERIDO:false}
  recepcion:
    procesador-habilitado: ${RECEPCION_PROCESADOR_HABILITADO:true}
    intervalo-procesador-ms: ${RECEPCION_INTERVALO_PROCESADOR_MS:1000}
    esperas: ${RECEPCION_ESPERAS:PT30S,PT2M,PT10M,PT30M,PT1H}
  operacion:
    url: ${OPERACION_REPARTO_URL:http://localhost:8082}
    token-servicio: ${OPERACION_TOKEN_SERVICIO:}
    cliente-id: ${OPERACION_CLIENT_ID:modulo-despacho}
    cliente-secreto: ${OPERACION_CLIENT_SECRET:}
  ventas:
    url: ${VENTAS_URL:http://127.0.0.1:1}
    token-servicio: ${VENTAS_TOKEN_SERVICIO:}
    cliente-id: ${VENTAS_CLIENT_ID:modulo-despacho}
    cliente-secreto: ${VENTAS_CLIENT_SECRET:}
    timeout-conexion-ms: ${VENTAS_TIMEOUT_CONEXION_MS:3000}
    timeout-lectura-ms: ${VENTAS_TIMEOUT_LECTURA_MS:5000}
  cotizacion:
    limite-por-minuto: ${LIMITE_COTIZACIONES_POR_MINUTO:60}
  productos:
    url: ${PRODUCTOS_URL:http://127.0.0.1:1}
    token-servicio: ${PRODUCTOS_TOKEN_SERVICIO:}
    cliente-id: ${PRODUCTOS_CLIENT_ID:modulo-despacho}
    cliente-secreto: ${PRODUCTOS_CLIENT_SECRET:}
    timeout-conexion-ms: ${PRODUCTOS_TIMEOUT_CONEXION_MS:3000}
    timeout-lectura-ms: ${PRODUCTOS_TIMEOUT_LECTURA_MS:6000}
    respaldo-temporal-habilitado: ${PRODUCTOS_RESPALDO_TEMPORAL_HABILITADO:false}
    stub:
      catalogo:
        POL-NEG-M:
          peso-kg: 0.25
          largo-cm: 10
          ancho-cm: 10
          alto-cm: 10
        ZAP-RUN-42:
          peso-kg: 1.40
          largo-cm: 20
          ancho-cm: 20
          alto-cm: 40

# Commit desplegado, expuesto en /actuator/info. Render define RENDER_GIT_COMMIT en
# cada despliegue; el pipeline lo compara con el commit que acaba de desplegar.
info:
  despliegue:
    commit: ${RENDER_GIT_COMMIT:local}
