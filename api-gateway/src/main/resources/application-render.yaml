# Orígenes exactos de los dos clientes publicados; JWT sigue siendo obligatorio.
despacho:
  cors:
    origenes: ${CORS_ORIGENES:https://despacho-administrativo.vercel.app,https://despacho-repartidor.vercel.app}
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: gestion-despachos
              uri: ${GESTION_DESPACHOS_URL:https://servicio-gestion-despachos.onrender.com}
              predicates:
                - Path=/api/v1/cotizaciones,/api/v1/despachos/**,/api/v1/seguimientos/**,/api/v1/zonas/**,/api/v1/catalogos/motivos-fallo
            - id: operacion-reparto
              uri: ${OPERACION_REPARTO_URL:https://servicio-operacion-reparto.onrender.com}
              predicates:
                - Path=/api/v1/repartidores/**,/api/v1/furgonetas/**,/api/v1/jornadas/**,/api/v1/flota/**,/api/v1/repartidor/**,/api/v1/evidencias/**
