name: g2-despacho

# Valores compartidos que Compose toma del .env de la raíz.
x-seguridad: &seguridad
  SEGURIDAD_URL: ${SEGURIDAD_URL:?Completa SEGURIDAD_URL en el archivo .env de la raiz del backend}
  SEGURIDAD_AUDIENCIA: ${SEGURIDAD_AUDIENCIA:-api-despacho}
  SEGURIDAD_ALGORITMO: ${SEGURIDAD_ALGORITMO:-RS256}

services:
  api-gateway:
    build:
      context: ./api-gateway
    environment:
      <<: *seguridad
      PORT: "8080"
      GESTION_DESPACHOS_URL: http://servicio-gestion-despachos:8081
      OPERACION_REPARTO_URL: http://servicio-operacion-reparto:8082
      # Los Swagger UI locales también necesitan permiso CORS para llamar al Gateway.
      CORS_ORIGENES: "${CORS_ORIGENES:-http://localhost:5173,http://localhost:5174},http://localhost:${GESTION_DESPACHOS_PORT:-8081},http://localhost:${OPERACION_REPARTO_PORT:-8082}"
      SOLICITUD_MAXIMO_BYTES: ${SOLICITUD_MAXIMO_BYTES:-1048576}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      servicio-gestion-despachos:
        condition: service_healthy
      servicio-operacion-reparto:
        condition: service_healthy

  servicio-gestion-despachos:
    build:
      context: ./servicio-gestion-despachos
    environment:
      <<: *seguridad
      PORT: "8081"
      SPRING_PROFILES_ACTIVE: integracion-local
      GATEWAY_PUBLIC_URL: "http://localhost:${GATEWAY_PORT:-8080}"
    ports:
      - "127.0.0.1:${GESTION_DESPACHOS_PORT:-8081}:8081"

  servicio-operacion-reparto:
    build:
      context: ./servicio-operacion-reparto
    environment:
      <<: *seguridad
      PORT: "8082"
      SPRING_PROFILES_ACTIVE: integracion-local
      GATEWAY_PUBLIC_URL: "http://localhost:${GATEWAY_PORT:-8080}"
    ports:
      - "127.0.0.1:${OPERACION_REPARTO_PORT:-8082}:8082"
