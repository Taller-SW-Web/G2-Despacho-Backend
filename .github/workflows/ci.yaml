name: CI/CD backend

# Cadena: compilar y probar + revisión de seguridad -> construir y escanear imágenes
#         -> compuerta -> desplegar -> verificar.
# El despliegue solo ocurre en main (push o ejecución manual) y únicamente si todo lo anterior salió bien.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Solo se cancelan ejecuciones obsoletas de PR; un push a develop/main termina siempre,
  # para que cada commit integrado conserve su resultado (y su despliegue, en main).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. COMPILAR Y PROBAR
  # ---------------------------------------------------------------------------
  verificador-f02:
    name: Pruebas del verificador F-02 (sin servicios)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Probar el verificador con dobles explícitos
        run: python3 -B -m unittest discover -s pruebas -p 'test_verificar_f02_publicado.py' -v

  servicios:
    name: Pruebas (${{ matrix.servicio }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        servicio:
          - api-gateway
          - servicio-gestion-despachos
          - servicio-operacion-reparto
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.servicio }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Java 25 y la caché de Maven
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.servicio }}/pom.xml

      - name: Comprobar Docker para las bases temporales
        if: matrix.servicio != 'api-gateway'
        run: docker info > /dev/null

      # Testcontainers crea PostgreSQL/PostGIS aislado; no se usa el Compose ni Supabase.
      - name: Compilar y ejecutar las pruebas unitarias y de integración
        run: bash ./mvnw --batch-mode --no-transfer-progress -Dpruebas.postgres.externo=false clean verify

      - name: Conservar los informes de pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pruebas-${{ matrix.servicio }}
          path: |
            ${{ matrix.servicio }}/target/surefire-reports/
            ${{ matrix.servicio }}/target/failsafe-reports/
            ${{ matrix.servicio }}/target/f05-rendimiento-local.json
            ${{ matrix.servicio }}/target/f06-rendimiento-local.json
          if-no-files-found: ignore
          retention-days: 7

  seguridad-local:
    name: Pruebas (seguridad-local)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Compilar y probar el emisor temporal
        run: |
          mkdir -p "$RUNNER_TEMP/seguridad-local-pruebas"
          javac --add-modules jdk.httpserver -encoding UTF-8 \
            -d "$RUNNER_TEMP/seguridad-local-pruebas" \
            seguridad-local/src/EmisorSeguridadLocal.java \
            seguridad-local/pruebas/EmisorSeguridadLocalPruebas.java
          java --add-modules jdk.httpserver \
            -cp "$RUNNER_TEMP/seguridad-local-pruebas" EmisorSeguridadLocalPruebas

  ventas-local:
    name: Pruebas (ventas-local)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Compilar y probar el doble de Ventas
        run: |
          mkdir -p "$RUNNER_TEMP/ventas-local-pruebas"
          javac --add-modules jdk.httpserver -encoding UTF-8 \
            -d "$RUNNER_TEMP/ventas-local-pruebas" \
            ventas-local/src/VentasLocal.java \
            ventas-local/pruebas/VentasLocalPruebas.java
          java --add-modules jdk.httpserver \
            -cp "$RUNNER_TEMP/ventas-local-pruebas" VentasLocalPruebas

  # ---------------------------------------------------------------------------
  # 1b. REVISIÓN DE SEGURIDAD: dependencias vulnerables
  #     OWASP Top 10:2025 A03 (Software Supply Chain Failures).
  #     Analiza las dependencias Maven de los servicios desplegables y falla si
  #     alguna tiene una vulnerabilidad conocida con CVSS >= 7 (alta o crítica).
  #     La base NVD se guarda en caché por día; NVD_API_KEY acelera su descarga.
  # ---------------------------------------------------------------------------
  dependencias:
    name: Seguridad (dependencias Maven)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION_DEPENDENCY_CHECK: '13.0.0'
      DATOS_DEPENDENCY_CHECK: ${{ github.workspace }}/../dependency-check-datos
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Java 25 y la caché de Maven
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '*/pom.xml'

      - name: Calcular la clave diaria de la base de vulnerabilidades
        id: fecha
        run: echo "dia=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Recuperar la base de vulnerabilidades (NVD)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DATOS_DEPENDENCY_CHECK }}
          key: dependency-check-${{ env.VERSION_DEPENDENCY_CHECK }}-${{ steps.fecha.outputs.dia }}
          restore-keys: dependency-check-${{ env.VERSION_DEPENDENCY_CHECK }}-

      - name: Analizar las dependencias de cada servicio
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SUPRESIONES: ${{ github.workspace }}/.github/seguridad/dependency-check-supresiones.xml
        run: |
          set -uo pipefail
          argumentos=(
            "org.owasp:dependency-check-maven:${VERSION_DEPENDENCY_CHECK}:check"
            "-DdataDirectory=${DATOS_DEPENDENCY_CHECK}"
            "-DsuppressionFile=${SUPRESIONES}"
            "-DfailBuildOnCVSS=7"
            "-Dformats=HTML,JSON"
            "-DossindexAnalyzerEnabled=false"
            "-DassemblyAnalyzerEnabled=false"
          )
          if [ -n "${NVD_API_KEY}" ]; then
            argumentos+=("-DnvdApiKey=${NVD_API_KEY}")
          else
            echo "::warning::Falta el secreto NVD_API_KEY: la primera descarga de la base NVD puede tardar mucho."
          fi

          estado=0
          for servicio in api-gateway servicio-gestion-despachos servicio-operacion-reparto; do
            echo "::group::Dependencias de ${servicio}"
            if (cd "${servicio}" && bash ./mvnw --batch-mode --no-transfer-progress "${argumentos[@]}"); then
              echo "- ${servicio}: sin vulnerabilidades con CVSS >= 7" >> "$GITHUB_STEP_SUMMARY"
            else
              if ls "${servicio}"/target/dependency-check-report.json > /dev/null 2>&1; then
                echo "::error::${servicio}: hay dependencias con vulnerabilidades CVSS >= 7 (ver el informe dependency-check)."
                echo "- ${servicio}: **vulnerabilidades CVSS >= 7**" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::${servicio}: Dependency-Check no pudo terminar el análisis (sin informe). Revisar el grupo del log; sin NVD_API_KEY la NVD suele rechazar la descarga."
                echo "- ${servicio}: **análisis no completado** (error de Dependency-Check o de la base NVD)" >> "$GITHUB_STEP_SUMMARY"
              fi
              estado=1
            fi
            echo "::endgroup::"
          done
          exit "${estado}"

      - name: Conservar los informes de dependencias
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seguridad-dependencias
          path: '*/target/dependency-check-report.*'
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 1c. REVISIÓN DE SEGURIDAD: secretos en el código y en el historial
  #     OWASP Top 10:2025 A02 (Security Misconfiguration) y A08 (Integrity).
  #     gitleaks revisa todos los commits; el informe se guarda con los valores
  #     ocultos (--redact). El binario se descarga por versión fija y se verifica
  #     su SHA-256 antes de ejecutarlo.
  # ---------------------------------------------------------------------------
  secretos:
    name: Seguridad (secretos en el historial)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION_GITLEAKS: '8.30.1'
      SHA256_GITLEAKS: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Obtener el código con todo el historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Instalar gitleaks verificado
        shell: bash
        run: |
          set -euo pipefail
          archivo="gitleaks_${VERSION_GITLEAKS}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --output "${RUNNER_TEMP}/${archivo}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION_GITLEAKS}/${archivo}"
          echo "${SHA256_GITLEAKS}  ${RUNNER_TEMP}/${archivo}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archivo}" -C "${RUNNER_TEMP}" gitleaks

      - name: Buscar secretos en todos los commits
        shell: bash
        run: |
          set -uo pipefail
          if "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --verbose \
              --report-format json --report-path gitleaks-informe.json .; then
            echo "gitleaks: no se encontraron secretos en el historial." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::gitleaks encontró posibles secretos. Revocar y rotar la credencial antes de limpiar el historial."
            echo "gitleaks: **posibles secretos encontrados** (ver el informe)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Conservar el informe de secretos (valores ocultos)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seguridad-secretos
          path: gitleaks-informe.json
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 1d. REVISIÓN DE SEGURIDAD: código propio (SAST) con CodeQL
  #     OWASP Top 10:2025 A05 (Injection), A07 (Authentication Failures),
  #     A04 (Cryptographic Failures), A02 (errores detallados) y, con el
  #     lenguaje "actions", A08 (integridad del propio pipeline).
  #     Dependency-Check y Trivy revisan las bibliotecas; gitleaks, los secretos;
  #     CodeQL revisa el código que escribe el equipo. Se analiza sin compilar
  #     (build-mode none) y falla con hallazgos de security-severity >= 7, el mismo
  #     umbral que Dependency-Check. Todos los hallazgos se publican en
  #     Security > Code scanning. Configuración: .github/codeql/codeql-config.yml.
  # ---------------------------------------------------------------------------
  codigo:
    name: Seguridad (código ${{ matrix.lenguaje }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [java-kotlin, actions]
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analizar el código (SAST)
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.lenguaje }}
          output: codeql-resultados

      # Las reglas pueden venir en tool.driver o en tool.extensions (paquetes de
      # consultas): se leen ambas para no perder la severidad de ningún hallazgo.
      - name: Bloquear hallazgos con severidad alta o crítica (>= 7)
        env:
          LENGUAJE: ${{ matrix.lenguaje }}
        run: |
          set -euo pipefail
          sarif="$(find codeql-resultados -name '*.sarif' | head -n 1)"
          if [ -z "${sarif}" ]; then
            echo "::error::CodeQL no generó el informe SARIF para ${LENGUAJE}."
            exit 1
          fi
          jq -r '
            .runs[]
            | ([.tool.driver.rules[]?, .tool.extensions[]?.rules[]?]
               | map({key: .id, value: (.properties["security-severity"] // "0" | tonumber)})
               | from_entries) as $severidad
            | .results[]
            | select((.suppressions // []) | length == 0)
            | ($severidad[.ruleId] // 0) as $s
            | select($s >= 7)
            | "\($s)\t\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"
          ' "${sarif}" > codeql-bloqueantes.tsv
          total="$(jq '[.runs[].results[]] | length' "${sarif}")"
          bloqueantes="$(wc -l < codeql-bloqueantes.tsv)"
          {
            echo "### CodeQL · ${LENGUAJE}"
            echo "Hallazgos: ${total} · Bloqueantes (security-severity >= 7): ${bloqueantes}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${bloqueantes}" -gt 0 ]; then
            { echo '```'; cat codeql-bloqueantes.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CodeQL encontró ${bloqueantes} hallazgo(s) con security-severity >= 7 en ${LENGUAJE} (ver el resumen y Security > Code scanning)."
            exit 1
          fi

      - name: Conservar el informe SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seguridad-codigo-${{ matrix.lenguaje }}
          path: |
            codeql-resultados/
            codeql-bloqueantes.tsv
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. CONSTRUIR (empaquetar) LAS IMÁGENES DOCKER
  #    En PR y en develop solo se verifica que cada Dockerfile construye.
  #    En main, además, se publica la imagen versionada por commit en GHCR.
  #    seguridad-local y ventas-local se construyen pero nunca se publican ni se
  #    despliegan: son dobles de prueba que no deben usarse en un despliegue público.
  # ---------------------------------------------------------------------------
  imagenes:
    name: Imagen Docker (${{ matrix.servicio }})
    needs: [verificador-f02, servicios, seguridad-local, ventas-local, dependencias, secretos, codigo]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: api-gateway
            publicar: true
          - servicio: servicio-gestion-despachos
            publicar: true
          - servicio: servicio-operacion-reparto
            publicar: true
          - servicio: seguridad-local
            publicar: false
          - servicio: ventas-local
            publicar: false
    env:
      SERVICIO: ${{ matrix.servicio }}
      PUBLICAR: ${{ matrix.publicar && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # Trivy se descarga por versión fija y SHA-256: no se usa aquasecurity/trivy-action,
      # cuyas etiquetas fueron reescritas con malware en marzo de 2026 (CVE-2026-33634).
      VERSION_TRIVY: '0.76.2'
      SHA256_TRIVY: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Construir la imagen
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          imagen="ghcr.io/${repo}/${SERVICIO}"
          echo "IMAGEN=${imagen}" >> "$GITHUB_ENV"
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${imagen}:${GITHUB_SHA}" \
            --tag "${imagen}:latest" \
            "./${SERVICIO}"
          docker image inspect "${imagen}:${GITHUB_SHA}" --format 'Imagen {{.RepoTags}} · {{.Size}} bytes'

      # Revisión de seguridad de la imagen (OWASP Top 10:2025 A03): paquetes del
      # sistema operativo base y bibliotecas del JAR. Una imagen con vulnerabilidades
      # CRITICAL o HIGH que ya tienen corrección no se publica ni se despliega.
      - name: Instalar Trivy verificado
        run: |
          set -euo pipefail
          archivo="trivy_${VERSION_TRIVY}_Linux-64bit.tar.gz"
          curl --silent --show-error --fail --location --output "${RUNNER_TEMP}/${archivo}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION_TRIVY}/${archivo}"
          echo "${SHA256_TRIVY}  ${RUNNER_TEMP}/${archivo}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archivo}" -C "${RUNNER_TEMP}" trivy
          "${RUNNER_TEMP}/trivy" --version

      - name: Generar el SBOM de la imagen (CycloneDX)
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/trivy" image --quiet --format cyclonedx \
            --output "sbom-${SERVICIO}.cdx.json" "${IMAGEN}:${GITHUB_SHA}"
          echo "SBOM generado: sbom-${SERVICIO}.cdx.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Escanear vulnerabilidades de la imagen (Trivy)
        run: |
          set -euo pipefail
          if "${RUNNER_TEMP}/trivy" image --quiet --no-progress \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
              --format table --output "trivy-${SERVICIO}.txt" "${IMAGEN}:${GITHUB_SHA}"; then
            echo "- Imagen ${SERVICIO}: sin vulnerabilidades CRITICAL/HIGH corregibles" >> "$GITHUB_STEP_SUMMARY"
            cat "trivy-${SERVICIO}.txt"
          else
            cat "trivy-${SERVICIO}.txt"
            echo "::error::La imagen ${SERVICIO} tiene vulnerabilidades CRITICAL/HIGH con corrección disponible."
            echo "- Imagen ${SERVICIO}: **vulnerabilidades CRITICAL/HIGH**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Conservar el SBOM y el informe de la imagen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seguridad-imagen-${{ matrix.servicio }}
          path: |
            sbom-${{ matrix.servicio }}.cdx.json
            trivy-${{ matrix.servicio }}.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Publicar la imagen en GHCR (solo main)
        if: env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGEN}:${GITHUB_SHA}"
          docker push "${IMAGEN}:latest"
          echo "Publicada ${IMAGEN}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. COMPUERTA: un único check que resume todo lo anterior, incluida la
  #    revisión de seguridad (dependencias, secretos, código e imágenes).
  #    Es el que conviene exigir en la protección de ramas (no depende de la matriz).
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI backend verde
    if: ${{ always() }}
    needs: [verificador-f02, servicios, seguridad-local, ventas-local, dependencias, secretos, codigo, imagenes]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Exigir que todas las etapas hayan salido bien
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados de las etapas: ${RESULTADOS}"
          for resultado in ${RESULTADOS}; do
            if [ "${resultado}" != "success" ]; then
              echo "::error::Alguna etapa no terminó en success (${RESULTADOS}). No se debe integrar ni desplegar."
              exit 1
            fi
          done

  # ---------------------------------------------------------------------------
  # 4. DESPLEGAR en Render (solo main) y 5. VERIFICAR la salud posterior.
  #    Requiere los secretos RENDER_DEPLOY_HOOK_* (ver README, "Despliegue continuo").
  #    En Render debe estar desactivado el despliegue automático al hacer push: este
  #    job es el único que despliega, y solo después de que la compuerta pasó.
  # ---------------------------------------------------------------------------
  desplegar:
    name: Desplegar en Render y verificar
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: [ci-ok]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: produccion
    concurrency:
      group: despliegue-backend-produccion
      cancel-in-progress: false
    steps:
      - name: Obtener el código (para la herramienta de verificación)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Orden: primero los servicios de dominio y al final el Gateway que los enruta.
      - name: Disparar los despliegues del commit
        env:
          HOOK_OPERACION: ${{ secrets.RENDER_DEPLOY_HOOK_OPERACION }}
          HOOK_GESTION: ${{ secrets.RENDER_DEPLOY_HOOK_GESTION }}
          HOOK_GATEWAY: ${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}
        run: |
          set -euo pipefail
          faltan=0
          for nombre in OPERACION GESTION GATEWAY; do
            var="HOOK_${nombre}"
            if [ -z "${!var}" ]; then
              echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_${nombre} (Settings > Secrets and variables > Actions)."
              faltan=1
            fi
          done
          [ "${faltan}" -eq 0 ] || exit 1

          disparar() {
            local nombre="$1" url="$2" codigo
            codigo="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 30 --retry 2 --retry-delay 5 --request POST "${url}&ref=${GITHUB_SHA}")"
            case "${codigo}" in
              2??) echo "${nombre}: despliegue solicitado (HTTP ${codigo})" ;;
              *)   echo "::error::${nombre}: Render respondió HTTP ${codigo}"; return 1 ;;
            esac
          }
          disparar "Operación" "${HOOK_OPERACION}"
          disparar "Gestión"   "${HOOK_GESTION}"
          disparar "Gateway"   "${HOOK_GATEWAY}"
          {
            echo "### Despliegue solicitado en Render"
            echo "Commit \`${GITHUB_SHA}\` para Operación, Gestión y Gateway."
          } >> "$GITHUB_STEP_SUMMARY"

      # El hook solo encola el despliegue: se espera a que arranque antes de consultar la salud.
      - name: Verificar la salud de los tres servicios
        run: |
          set -uo pipefail
          sleep 90
          for intento in $(seq 1 14); do
            echo "::group::Intento ${intento} de 14"
            if python3 -B herramientas/mantener_despacho_activo.py --una-vez --timeout 90; then
              echo "::endgroup::"
              echo "Gateway, Gestión y Operación responden 200 y status=UP." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            sleep 30
          done
          echo "::error::Los servicios no quedaron UP tras el despliegue. Revisar los logs en Render."
          exit 1

      # El health check puede responder UP con la versión anterior mientras Render
      # termina de desplegar. Aquí se espera a que cada servicio informe en
      # /actuator/info el mismo commit que este pipeline acaba de desplegar.
      - name: Verificar que se desplegó este commit
        env:
          URL_GATEWAY: https://taller-api-gateway.onrender.com
          URL_GESTION: https://taller-servicio-gestion-despachos.onrender.com
          URL_OPERACION: https://taller-servicio-operacion-reparto.onrender.com
        run: |
          set -uo pipefail
          pendientes="Gateway Gestión Operación"
          sin_dato=""
          for intento in $(seq 1 20); do
            siguen=""
            for nombre in ${pendientes}; do
              case "${nombre}" in
                Gateway) url="${URL_GATEWAY}" ;;
                Gestión) url="${URL_GESTION}" ;;
                Operación) url="${URL_OPERACION}" ;;
              esac
              commit="$(curl --silent --max-time 60 "${url}/actuator/info" | jq -r '.despliegue.commit // empty' 2>/dev/null || true)"
              if [ "${commit}" = "${GITHUB_SHA}" ]; then
                echo "${nombre}: ejecuta el commit ${commit}"
              elif [ "${commit}" = "local" ]; then
                echo "::warning::${nombre}: Render no informó RENDER_GIT_COMMIT; no se puede comprobar la versión."
                sin_dato="${sin_dato} ${nombre}"
              else
                echo "${nombre}: aún informa '${commit:-sin respuesta}', se espera ${GITHUB_SHA}"
                siguen="${siguen} ${nombre}"
              fi
            done
            pendientes="${siguen}"
            if [ -z "${pendientes// /}" ]; then
              if [ -z "${sin_dato}" ]; then
                echo "Gateway, Gestión y Operación ejecutan el commit \`${GITHUB_SHA}\`." | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "Versión sin comprobar en:${sin_dato} (sin RENDER_GIT_COMMIT); el resto ejecuta \`${GITHUB_SHA}\`." | tee -a "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            sleep 30
          done
          echo "::error::Siguen sin ejecutar ${GITHUB_SHA}:${pendientes}. Revisar el despliegue en Render."
          exit 1

      # Smoke test de seguridad en producción: autenticación en el Gateway y
      # enmascaramiento de las URL directas de los servicios (X-Despacho-Interno).
      - name: Verificar la seguridad activa en producción
        env:
          URL_GATEWAY: https://taller-api-gateway.onrender.com
          URL_GESTION: https://taller-servicio-gestion-despachos.onrender.com
          URL_OPERACION: https://taller-servicio-operacion-reparto.onrender.com
        run: |
          set -uo pipefail
          fallos=0
          comprobar() {
            local descripcion="$1" url="$2" esperado="$3" codigo=""
            for intento in 1 2 3; do
              codigo="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 60 "${url}")"
              case "${codigo}" in 000|5??) sleep 15 ;; *) break ;; esac
            done
            if [ "${codigo}" = "${esperado}" ]; then
              echo "- ${descripcion}: HTTP ${codigo}" >> "$GITHUB_STEP_SUMMARY"
              echo "OK ${descripcion}: HTTP ${codigo}"
            else
              echo "::error::${descripcion}: se esperaba HTTP ${esperado} y se obtuvo ${codigo}."
              echo "- ${descripcion}: **HTTP ${codigo}** (se esperaba ${esperado})" >> "$GITHUB_STEP_SUMMARY"
              fallos=1
            fi
          }
          echo "### Seguridad activa en producción" >> "$GITHUB_STEP_SUMMARY"
          comprobar "Gateway sin token, GET /api/v1/zonas" "${URL_GATEWAY}/api/v1/zonas" 401
          comprobar "Gestión directo, GET /api/v1/zonas" "${URL_GESTION}/api/v1/zonas" 404
          comprobar "Operación directo, GET /api/v1/jornadas" "${URL_OPERACION}/api/v1/jornadas" 404
          exit "${fallos}"
