name: g2-despacho-local

# Entorno local completo para pruebas y depuración: PostgreSQL propio, emisor temporal
# de Seguridad, los dos microservicios y el Gateway, con depuración remota de Java.
# No conecta a Supabase, Render ni Seguridad real. Guía: docs/entorno-local-docker.md
#
#   docker compose -f compose.local.yaml up --build -d
#   docker compose -f compose.local.yaml --profile herramientas up -d   # añade Adminer

x-java-depuracion: &java-depuracion
  # JDWP en el puerto interno 5005 de cada contenedor; suspend=y espera al depurador antes de arrancar.
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -agentlib:jdwp=transport=dt_socket,server=y,suspend=${JAVA_DEBUG_SUSPEND:-n},address=*:5005"

x-seguridad-local: &seguridad-local
  SEGURIDAD_URL: http://seguridad-local:8090
  SEGURIDAD_AUDIENCIA: api-despacho
  SEGURIDAD_ALGORITMO: RS256

x-base-datos: &base-datos
  SPRING_DATASOURCE_USERNAME: ${LOCAL_DB_USUARIO:-despacho_local}
  SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_CLAVE:-despacho-local-no-produccion}
  # Igual que Render/Supabase: el esquema lo crea el script de inicialización, no Flyway,
  # porque Gestión tiene dos migraciones V3 sin conciliar (docs/f06-jornadas-capacidad.md).
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: none
  DOCUMENTACION_HABILITADA: "true"
  GATEWAY_PUBLIC_URL: "http://localhost:${GATEWAY_PORT:-8080}"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${LOCAL_DB_USUARIO:-despacho_local}
      POSTGRES_PASSWORD: ${LOCAL_DB_CLAVE:-despacho-local-no-produccion}
      POSTGRES_DB: postgres
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./herramientas/entorno-local/postgres:/docker-entrypoint-initdb.d:ro
      - ./servicio-gestion-despachos/src/main/resources/db/migration:/migraciones/despacho_gestion:ro
      - ./servicio-operacion-reparto/src/main/resources/db/migration:/migraciones/despacho_operacion:ro
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-15432}:5432"
    healthcheck:
      # Por TCP: durante la inicialización PostgreSQL solo escucha en el socket local,
      # así que el servicio queda sano cuando ya terminaron todas las migraciones.
      test: [CMD-SHELL, 'psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d despacho_operacion -c "select 1" > /dev/null']
      interval: 3s
      timeout: 3s
      retries: 40

  seguridad-local:
    build: ./herramientas/seguridad-local
    environment:
      HABILITAR_SEGURIDAD_LOCAL: "true"
      DIRECCION_ESCUCHA: 0.0.0.0
      PORT: "8090"
    ports:
      - "127.0.0.1:${SEGURIDAD_LOCAL_PORT:-8090}:8090"

  servicio-gestion-despachos:
    build: ./servicio-gestion-despachos
    environment:
      <<: [*java-depuracion, *seguridad-local, *base-datos]
      PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/despacho_gestion
      OPERACION_REPARTO_URL: http://servicio-operacion-reparto:8082
      OPERACION_CLIENT_ID: modulo-despacho
      OPERACION_CLIENT_SECRET: despacho-local-no-produccion
    ports:
      - "127.0.0.1:${GESTION_DESPACHOS_PORT:-8081}:8081"
      - "127.0.0.1:${GESTION_DEBUG_PORT:-5005}:5005"
    depends_on:
      postgres:
        condition: service_healthy
      seguridad-local:
        condition: service_healthy

  servicio-operacion-reparto:
    build: ./servicio-operacion-reparto
    environment:
      <<: [*java-depuracion, *seguridad-local, *base-datos]
      PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/despacho_operacion
      GESTION_DESPACHOS_URL: http://servicio-gestion-despachos:8081
      # Sin almacenamiento local: la autorización de carga/lectura de evidencias queda no disponible.
      EVIDENCIAS_STORAGE_URL: ${EVIDENCIAS_STORAGE_URL:-}
      EVIDENCIAS_BUCKET: ${EVIDENCIAS_BUCKET:-}
      EVIDENCIAS_CLAVE_SERVICIO: ${EVIDENCIAS_CLAVE_SERVICIO:-}
    ports:
      - "127.0.0.1:${OPERACION_REPARTO_PORT:-8082}:8082"
      - "127.0.0.1:${OPERACION_DEBUG_PORT:-5006}:5005"
    depends_on:
      postgres:
        condition: service_healthy
      seguridad-local:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    environment:
      <<: [*java-depuracion, *seguridad-local]
      PORT: "8080"
      GESTION_DESPACHOS_URL: http://servicio-gestion-despachos:8081
      OPERACION_REPARTO_URL: http://servicio-operacion-reparto:8082
      CORS_ORIGENES: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:${GESTION_DESPACHOS_PORT:-8081},http://localhost:${OPERACION_REPARTO_PORT:-8082}"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      - "127.0.0.1:${GATEWAY_DEBUG_PORT:-5007}:5005"
    depends_on:
      seguridad-local:
        condition: service_healthy
      servicio-gestion-despachos:
        condition: service_healthy
      servicio-operacion-reparto:
        condition: service_healthy

  adminer:
    image: adminer:5
    profiles: [herramientas]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  datos-postgres:
